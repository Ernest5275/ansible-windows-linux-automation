---
- name: Check whether users from a CSV file exist
  hosts: localhost
  gather_facts: no

  vars:
    user_list: "{{ lookup('file', playbook_dir + '/usernames.csv').splitlines() }}"

  tasks:
    - name: Check if each user exists (custom Python module)
      check_user:
        username: "{{ item }}"
      loop: "{{ user_list }}"
      register: results

    - name: Summarize the results
      ansible.builtin.debug:
        msg: "{{ item.username }}: {{ 'exists' if item.exists else 'does not exist' }}"
      loop: "{{ results.results }}"
      loop_control:
        label: "{{ item.username }}"
