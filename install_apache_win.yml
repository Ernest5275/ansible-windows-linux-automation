---
- name: Install Apache on Windows Server
  hosts: windows
  tasks:
    - name: Create a working directory
      ansible.windows.win_file:
        path: C:\ansible_examples
        state: directory

    - name: Download the Apache MSI installer
      ansible.windows.win_get_url:
        url: http://archive.apache.org/dist/httpd/binaries/win32/httpd-2.2.25-win32-x86-no_ssl.msi
        dest: C:\ansible_examples\httpd-2.2.25-win32-x86-no_ssl.msi

    - name: Install the MSI package
      ansible.windows.win_package:
        path: C:\ansible_examples\httpd-2.2.25-win32-x86-no_ssl.msi
        state: present
