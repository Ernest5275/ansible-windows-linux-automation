---
- name: Reset passwords from a CSV file with a custom module
  hosts: localhost
  become: yes

  vars:
    csv_file: "{{ playbook_dir }}/users.csv"
    library_dir: "{{ playbook_dir }}"

  tasks:
    - name: Read the CSV file
      community.general.read_csv:
        path: "{{ csv_file }}"
      register: users_list

    - name: Reset each password with the custom BASH script
      ansible.builtin.command: >
        {{ library_dir }}/reset_password.sh
        {{ item.username }} {{ item.password }}
      loop: "{{ users_list.list }}"
      no_log: true
