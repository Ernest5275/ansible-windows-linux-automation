---
- name: Manage Windows users, groups, and ACLs
  hosts: windows
  gather_facts: no

  tasks:
    - name: Create ECPIgroup
      ansible.windows.win_group:
        name: ECPIgroup
        state: present

    - name: Create ECPIadmin and ECPIuser accounts
      ansible.windows.win_user:
        name: "{{ item }}"
        password: "{{ windows_default_password }}"
        state: present
        groups:
          - ECPIgroup
        groups_action: add
      loop:
        - ECPIadmin
        - ECPIuser
      no_log: true

    - name: Create the C:\ECPI directory
      ansible.windows.win_file:
        path: C:\ECPI
        state: directory

    - name: Grant ECPIgroup Full Control on C:\ECPI
      ansible.windows.win_acl:
        path: C:\ECPI
        user: ECPIgroup
        rights: FullControl
        type: allow
        state: present
