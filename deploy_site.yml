---
- name: Deploy a custom web page
  hosts: ubuntu
  become: yes

  tasks:
    - name: Create index.html
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        mode: "0644"
        content: |
          <html>
          <body>
          <h1>Deployed with Ansible</h1>
          <p>{{ ansible_date_time.date }}</p>
          <p>Ansible Automation Final Project</p>
          </body>
          </html>
