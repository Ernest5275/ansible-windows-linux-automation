---
- name: Create a folder with a custom ACL
  hosts: windows
  gather_facts: no

  vars:
    lab_group: LabGroup
    folder_path: C:\FinalExam

  tasks:
    - name: Create the directory
      ansible.windows.win_file:
        path: "{{ folder_path }}"
        state: directory

    - name: Disable permission inheritance
      ansible.windows.win_acl_inheritance:
        path: "{{ folder_path }}"
        state: absent

    - name: Grant Full Control to the lab group
      ansible.windows.win_acl:
        path: "{{ folder_path }}"
        user: "{{ lab_group }}"
        rights: FullControl
        type: allow
        state: present
